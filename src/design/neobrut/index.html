<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Regret Map // Missed Experiences Archive</title>
  
  <!-- Neo-Brutalist Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Heatmap -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  
  <!-- Rounded Neo-Brutalist Stylesheet -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ==================== MINIMAL CLEAN HEADER ==================== -->
  <header class="app-header">
    <div class="header-main-nav">
      <a class="brand-container" onclick="window.regretApp.backToFeed()">
        <div class="brand-stamp">RM</div>
        <span class="brand-title">REGRET MAP</span>
      </a>

      <!-- Clean Rounded Search Bar -->
      <div class="header-search-bar">
        <svg class="search-icon-pos" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input 
          type="text" 
          class="search-input-brutal" 
          placeholder="Search regrets, cities, or landmarks..." 
          id="global-search-input">
      </div>

      <!-- Actions -->
      <div class="header-actions">
        <button class="btn-brutal btn-yellow btn-pill" id="btn-open-log-modal">
          + Log Regret
        </button>

        <div class="avatar-circle" title="u/guest_explorer">GE</div>
      </div>
    </div>
  </header>

  <!-- ==================== SPACIOUS 3-COLUMN LAYOUT ==================== -->
  <main class="app-layout-grid">

    <!-- ========== LEFT SIDEBAR ========== -->
    <aside class="sidebar-left" aria-label="Navigation">
      <!-- Nav Menu Card -->
      <div class="nav-menu-box">
        <nav style="display: flex; flex-direction: column; gap: 4px;">
          <a class="nav-link-brutal active" id="nav-item-feed" onclick="window.regretApp.backToFeed()">
            <span>📰</span>
            <span>Feed</span>
          </a>

          <a class="nav-link-brutal" id="nav-item-map" onclick="document.getElementById('view-btn-map').click()">
            <span>🗺️</span>
            <span>Heatmap</span>
          </a>
        </nav>
      </div>

      <!-- Simple Category Filter -->
      <div class="category-filter-box">
        <span class="mono-meta" style="font-weight: 700;">FILTER</span>
        <div class="filter-tags-grid">
          <button class="filter-chip active" data-category="ALL">All</button>
          <button class="filter-chip" data-category="TRAFFIC">Traffic</button>
          <button class="filter-chip" data-category="WEATHER">Weather</button>
          <button class="filter-chip" data-category="TIMING">Closures</button>
        </div>
      </div>
    </aside>

    <!-- ========== MAIN FEED & THREAD COLUMN ========== -->
    <section class="main-column" aria-label="Main Feed">
      
      <!-- Rounded View Switcher & Sort Toolbar -->
      <div class="view-switcher-container">
        <div class="view-slider-track">
          <button class="view-slider-btn active" id="view-btn-feed">
            Feed
          </button>
          <button class="view-slider-btn" id="view-btn-map">
            Heatmap
          </button>
          <button class="view-slider-btn" id="view-btn-split">
            Split
          </button>
        </div>

        <div class="feed-sort-bar">
          <button class="sort-btn active" data-sort="hot">🔥 Hot</button>
          <button class="sort-btn" data-sort="new">⚡ New</button>
          <button class="sort-btn" data-sort="top">🏆 Top</button>
        </div>
      </div>

      <!-- Feed Container -->
      <div id="feed-view-container">
        <!-- Rendered by js/app.js -->
      </div>

      <!-- Deep Thread View -->
      <div id="deep-thread-container" class="deep-thread-view" style="display: none;">
        <!-- Rendered by js/app.js -->
      </div>

      <!-- Heatmap View Section -->
      <div id="heatmap-view-section" class="heatmap-view-section" style="display: none;">
        <div class="map-viewport-frame">
          <div id="leaflet-map-container"></div>
          
          <div class="map-overlay-controls">
            <span class="mono-meta" style="font-weight: 700; color: #000;">RADAR</span>
            <button class="btn-brutal btn-sm btn-yellow btn-pill" onclick="window.regretMapEngine.flyToSpot('bromo-sunset')">
              Mt. Bromo
            </button>
            <button class="btn-brutal btn-sm btn-pill" onclick="window.regretMapEngine.flyToSpot('louvre-tuesday')">
              Paris
            </button>
            <button class="btn-brutal btn-sm btn-pill" onclick="window.regretMapEngine.flyToSpot('shibuya-train')">
              Tokyo
            </button>
          </div>

          <div class="heatmap-legend-card">
            <div style="display: flex; justify-content: space-between; font-family: var(--font-mono); font-size: 0.72rem; font-weight: 700;">
              <span>Mild</span>
              <span>Severe</span>
            </div>
            <div class="heat-gradient-bar"></div>
          </div>
        </div>
      </div>

      <!-- Split View Section -->
      <div id="split-view-section" class="split-layout-view" style="display: none;">
        <div class="split-feed-scroll" id="split-feed-container"></div>
        <div class="map-viewport-frame">
          <div id="split-map-container"></div>
        </div>
      </div>

    </section>

    <!-- ========== RIGHT SIDEBAR (STREAMLINED & MINIMAL) ========== -->
    <aside class="sidebar-right" aria-label="Radar and Hotspots">
      
      <!-- Rounded Mini-Radar Scanner Widget -->
      <div class="radar-mini-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h4 style="font-size: 0.9rem;">Live Radar</h4>
          <span class="badge-brutal badge-red" style="font-size: 9px;">Active</span>
        </div>
        
        <div class="mini-map-preview-box" onclick="document.getElementById('view-btn-map').click()" title="Click to view full map">
          <div class="radar-sweep-line"></div>
          <div class="radar-dot" style="top: 35%; left: 48%;"></div>
          <div class="radar-dot" style="top: 65%; left: 74%;"></div>
          <div class="radar-dot" style="top: 40%; left: 82%;"></div>
          
          <div style="position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,0.85); color: #FFF; padding: 2px 8px; font-family: var(--font-mono); font-size: 10px; border-radius: 9999px;">
            Open Map ↗
          </div>
        </div>
      </div>

      <!-- Trending Hotspots -->
      <div class="card-brutal static-card" style="padding: 16px;">
        <h4 style="font-size: 0.9rem; margin-bottom: 10px;">Trending Hotspots</h4>
        <div class="trending-list">
          <div class="trending-item" onclick="window.regretApp.openThreadView('bromo-sunset')">
            <div>
              <div style="font-family: var(--font-display); font-weight: 700; font-size: 0.85rem;">Mt. Bromo, ID</div>
              <div class="mono-meta">Traffic stall</div>
            </div>
            <span class="badge-brutal badge-red">+1.2k</span>
          </div>

          <div class="trending-item" onclick="window.regretApp.openThreadView('shibuya-train')">
            <div>
              <div style="font-family: var(--font-display); font-weight: 700; font-size: 0.85rem;">Shibuya, JP</div>
              <div class="mono-meta">Last train missed</div>
            </div>
            <span class="badge-brutal badge-yellow">+940</span>
          </div>

          <div class="trending-item" onclick="window.regretApp.openThreadView('louvre-tuesday')">
            <div>
              <div style="font-family: var(--font-display); font-weight: 700; font-size: 0.85rem;">Louvre, FR</div>
              <div class="mono-meta">Closed Tuesday</div>
            </div>
            <span class="badge-brutal badge-blue">+810</span>
          </div>
        </div>
      </div>

    </aside>

  </main>

  <!-- ==================== MODAL: LOG A REGRET ==================== -->
  <div class="modal-overlay" id="modal-log-regret" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <div class="modal-window">
      <div class="modal-header">
        <h3 id="modal-heading" style="font-size: 1.15rem;">Log a Missed Experience</h3>
        <button class="btn-brutal btn-sm" id="btn-close-log-modal" style="padding: 2px 8px; border-radius: 50%;" aria-label="Close modal">✕</button>
      </div>

      <form id="form-log-regret" class="modal-body">
        <div class="form-field-group">
          <label class="form-label" for="input-regret-title">What did you miss?</label>
          <input 
            type="text" 
            id="input-regret-title" 
            class="form-input-brutal" 
            placeholder="e.g. Missed the Amalfi ferry due to lemon cart traffic" 
            required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-field-group">
            <label class="form-label" for="input-regret-location">Location</label>
            <input 
              type="text" 
              id="input-regret-location" 
              class="form-input-brutal" 
              placeholder="e.g. Positano, Italy" 
              required>
          </div>

          <div class="form-field-group">
            <label class="form-label" for="select-regret-category">Category</label>
            <select id="select-regret-category" class="form-input-brutal">
              <option value="TRAFFIC / LOGISTICS">Traffic / Logistics</option>
              <option value="WEATHER DISASTER">Weather</option>
              <option value="TIMING / CLOSURE">Timing / Closure</option>
              <option value="TOURIST TRAP">Tourist Trap</option>
            </select>
          </div>
        </div>

        <div class="form-field-group">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label">Regret Severity</label>
            <span id="severity-value-display" class="badge-brutal badge-red">8.5/10</span>
          </div>
          <input 
            type="range" 
            id="regret-severity-slider" 
            class="slider-brutal" 
            min="1.0" 
            max="10.0" 
            step="0.1" 
            value="8.5">
        </div>

        <div class="form-field-group">
          <label class="form-label" for="input-regret-story">Brief Story</label>
          <textarea 
            id="input-regret-story" 
            class="form-input-brutal" 
            rows="3" 
            placeholder="What went wrong?" 
            required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 10px; padding-top: 8px;">
          <button type="submit" class="btn-brutal btn-yellow btn-pill">
            Post Regret →
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  
  <!-- Map Engine -->
  <script src="js/map.js"></script>
  
  <!-- App Logic -->
  <script src="js/app.js"></script>

</body>
</html>
