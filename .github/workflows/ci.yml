# Continuous integration: lint, type-check and build on PRs and pushes to main.
# Actions are pinned to full commit SHAs; the comment shows the matching release tag.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Read-only token. `pull_request` runs from forks never receive secrets.
permissions:
  contents: read

# Cancel superseded runs for the same PR or branch.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  quality:
    name: Lint, type-check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `next typegen` generates route types (e.g. LayoutProps) that tsc needs.
      - name: Type-check
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
